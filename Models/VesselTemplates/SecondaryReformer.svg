<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 700">
  <!-- Outer vessel: deliberately built in the same minimal style as SingleBedVessel. -->
  <path
    d="M 90 0
       L 130 0
       L 220 120
       L 220 640
       C 220 673.137, 170.751 700, 110 700
       C 49.249 700, 0 673.137, 0 640
       L 0 120
       L 90 0
       Z"
    style="stroke: rgb(0, 0, 0); fill: none;"/>

  <!-- Grey tray/support fill only. The crown is exactly y=600. -->
  <path
    d="M 0 620
       C 73.333333 593.333333, 146.666667 593.333333, 220 620
       L 220 625
       L 0 625
       Z"
    style="stroke: none; fill: rgb(224, 224, 224);"/>

  <!-- Tray/support boundaries. Kept open so they do not double-stroke the vessel walls. -->
  <path
    d="M 0 620
       C 73.333333 593.333333, 146.666667 593.333333, 220 620"
    style="stroke: rgb(0, 0, 0); fill: none;"/>
  <path
    d="M 0 625 L 220 625"
    style="stroke: rgb(0, 0, 0); fill: none;"/>
</svg>
